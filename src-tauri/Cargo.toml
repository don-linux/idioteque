[workspace]
members = ["cef-host"]

[package]
name = "idioteque"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "idioteque_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
portable-pty = "0.8"
notify = "6.1"
notify-debouncer-mini = "0.4"
fontdb = "0.23"
# Navegador CEF (src/cef): descarga, verificación y extracción del runtime.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
tar = "0.4"
bzip2 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# XID de la ventana Tauri para reparentar la ventana de cef-host (mismas versiones que tao).
gtk = "0.18"
gdk = "0.18"
gdkx11 = "0.18"
# XSetInputFocus para devolver el foco X11 del hijo CEF al toplevel.
x11 = { version = "2", features = ["xlib"] }
# Probe de user namespaces (`unshare` / `CLONE_NEWUSER`) cuando no hay `unshare(1)`.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

