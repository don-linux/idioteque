[package]
name = "cef-host"
version = "0.1.0"
description = "Proceso navegador de idioteque: carga libcef desde un slot y se embebe como ventana hija"
edition = "2021"
publish = false

[[bin]]
name = "cef-host"
path = "src/main.rs"

[dependencies]
# Versión del crate = versión de CEF del base bundleado (ver ../cef/base.json).
cef = { version = "152.3.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
